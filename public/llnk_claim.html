<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Claim LLNK Token</title>
<style>
  body { background-color: #000; color: #fff; font-family: Arial, sans-serif; padding: 20px; }
  .container { max-width: 700px; margin: 40px auto; padding: 30px; background-color: #111; border-radius: 10px; text-align: center; box-shadow: 0 0 15px rgba(255,255,255,0.1); }
  h1 { font-size: 28px; margin-bottom: 15px; }
  p { font-size: 16px; line-height: 1.6; margin-bottom: 20px; }
  input, button { font-size: 16px; padding: 10px; margin: 8px 0; width: 90%; border-radius: 5px; border: none; }
  button { background-color: #28a745; color: #fff; cursor: pointer; }
  button:hover { background-color: #218838; }
  #result { margin-top: 20px; font-size: 16px; color: #ffcc00; }
</style>
</head>
<body>

<div class="container">
  <h1>Claim Your LLNK Tokens</h1>
  <p>Enter your PayPal Transaction ID, Wallet Address, and optionally your email.</p>

  <form id="claimForm">
    <input type="text" id="txn_id" placeholder="PayPal Transaction ID" required /><br/>
    <input type="text" id="wallet_address" placeholder="Wallet Address" required /><br/>
    <input type="email" id="email" placeholder="Email (optional)" /><br/>
    <button type="submit">Claim Tokens</button>
  </form>

  <p id="result"></p>

  <h2>Subscribe to Push Notifications</h2>
  <button id="subscribeBtn">Subscribe</button>
</div>

<script>
const publicVapidKey = '<YOUR_PUBLIC_VAPID_KEY>'; // from your backend env

// Convert VAPID key
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

// Push subscription
async function subscribePush() {
  if ('serviceWorker' in navigator && 'PushManager' in window) {
    try {
      const registration = await navigator.serviceWorker.register('/sw.js');
      const subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicVapidKey)
      });
      const res = await fetch('/api/push/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(subscription)
      });
      const result = await res.json();
      alert(result.success ? 'Subscribed to push notifications!' : 'Subscription failed.');
    } catch (err) {
      console.error('Push subscription error:', err);
      alert('Push subscription failed.');
    }
  } else {
    alert('Push notifications are not supported in this browser.');
  }
}

// Claim tokens form
document.getElementById('claimForm').addEventListener('submit', async e => {
  e.preventDefault();
  const txn_id = document.getElementById('txn_id').value.trim();
  const wallet_address = document.getElementById('wallet_address').value.trim();
  const email = document.getElementById('email').value.trim();

  if (!txn_id || !wallet_address) return alert('Transaction ID and wallet are required.');

  const res = await fetch('/api/claim', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ txn_id, wallet_address, email })
  });

  const data = await res.json();
  const resultEl = document.getElementById('result');
  if (data.success) {
    resultEl.textContent = `✅ Success! Tokens sent. Transaction hash: ${data.txHash}`;
  } else {
    resultEl.textContent = `❌ Error: ${data.error || 'Unknown error'}`;
  }
});

document.getElementById('subscribeBtn').addEventListener('click', subscribePush);
</script>

</body>
</html>
