services:
  - type: web
    name: limlink-backend-token-claim1
    env: node
    plan: free      # or 'starter' / 'standard' depending on your Render plan
    region: oregon  # change to 'frankfurt' if in EU
    branch: token_claim1
    buildCommand: "npm install"
    startCommand: "npm start"
    autoDeploy: true

    envVars:
      # Server port
      - key: PORT
        value: 4000

      # Admin key for /api/admin/send-update
      - key: ADMIN_KEY
        sync: false

      # Blockchain / LLNK
      - key: AMOY_RPC
        value: "https://rpc-amoy.polygon.technology"
      - key: TOKEN_CONTRACT
        sync: false
      - key: HOTWALLET_ADDRESS
        sync: false

      # Push notifications
      - key: PUBLIC_VAPID_KEY
        sync: false
      - key: PRIVATE_VAPID_KEY
        sync: false

      # Optional MongoDB (reuse the same cluster as your other backend)
      - key: MONGO_URI
        sync: false
